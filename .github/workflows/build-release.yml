name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: stable-lib-v1
      - name: Keep Zig library paths stable
        run: ${{ matrix.python }} .github/scripts/stabilize-zig-lib.py
      - name: Test SOCKS5 behavior
        shell: bash
        run: |
          make test PYTHON=${{ matrix.python }}

  test-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check resolver lifetimes and protocol behavior with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -DMAX_CLIENTS=2 -DIDLE_TIMEOUT_SECONDS=3 -DHANDSHAKE_TIMEOUT_SECONDS=1 tests/test_faults.c -o fault-sanitized -pthread
          ./fault-sanitized --test-internals
          python3 tests/test_proxy.py ./fault-sanitized --faults FaultProxyTests FaultClientSetupTests \
            ProxyTests.test_domain_connect_and_pipelined_payload \
            ProxyTests.test_udp_domain_and_empty_payload \
            ProxyTests.test_tcp_client_reset_under_backpressure_releases_slot \
            ProxyTests.test_tcp_target_reset_under_backpressure_releases_slot \
            ProxyTests.test_tcp_half_close_under_backpressure \
            IPv6ProxyTests WildcardListenerTests WildcardIPv6ListenerTests -v

  build:
    needs: [test, test-memory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: stable-lib-v1
      - name: Keep Zig library paths stable
        run: python3 .github/scripts/stabilize-zig-lib.py

      - name: Build Linux, Windows, and macOS binaries
        run: |
          make release
          (cd dist && sha256sum tinysocks-* > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: tinysocks-binaries
          path: dist/
          if-no-files-found: error

  test-release:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: tinysocks-linux-x86_64
            python: python3
          - os: macos-latest
            binary: tinysocks-macos
            python: python3
          - os: windows-latest
            binary: tinysocks-windows-x86_64.exe
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tinysocks-binaries
          path: dist
      - name: Verify and test release binaries
        shell: bash
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          binary=${{ matrix.binary }}
          if [ "$RUNNER_OS" = macOS ]; then
            case "$(uname -m)" in
              arm64) binary=tinysocks-macos-arm64 ;;
              x86_64) binary=tinysocks-macos-x86_64 ;;
              *) exit 1 ;;
            esac
          fi
          if [ "$RUNNER_OS" != Windows ]; then chmod +x "dist/$binary"; fi
          ${{ matrix.python }} tests/test_proxy.py "dist/$binary" --release -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tinysocks-binaries
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
